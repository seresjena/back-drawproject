spring.application.name=arquidraw-backend

# Puerto HTTP (MCP + WebSocket)
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Servidor MCP (Streamable HTTP). Endpoint por defecto: /mcp
# Todo lo configurable por variables de entorno para poder moverlo a la nube
# mas adelante sin cambiar codigo.
# ---------------------------------------------------------------------------
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=${MCP_SERVER_NAME:arquidraw}
spring.ai.mcp.server.version=${MCP_SERVER_VERSION:0.1.0}
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.instructions=Servidor de diagramas de arquitectura ArquiDraw. Permite leer y modificar el diagrama activo. Cada cambio se refleja en vivo en el editor (WebSocket).
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# ---------------------------------------------------------------------------
# Log
# ---------------------------------------------------------------------------
logging.level.app.arquidraw=INFO
