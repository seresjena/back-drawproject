spring.application.name=arquidraw-backend

# Puerto HTTP (MCP + WebSocket)
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Servidor MCP (Streamable HTTP). Endpoint por defecto: /mcp
# Todo lo configurable por variables de entorno para poder moverlo a la nube
# mas adelante sin cambiar codigo.
# ---------------------------------------------------------------------------
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=${MCP_SERVER_NAME:arquidraw}
spring.ai.mcp.server.version=${MCP_SERVER_VERSION:0.1.0}
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.instructions=Servidor de diagramas de arquitectura ArquiDraw. Permite leer y modificar \
el diagrama activo de la sala del usuario; cada cambio se ve en vivo en su editor. Flujo recomendado: \
1) get_meta (contentBounds y, si hay editor conectado, viewport y visibleWorld = zona visible). \
2) add_node por componente, con technology y summary; coloca x/y dentro de visibleWorld o omitelos. \
3) add_connection con lados 'auto'. 4) Si no colocaste a mano, auto_layout. \
5) focus_nodes para senalar lo que cambiaste y set_view al final si quieres un zoom concreto \
(el editor se reencuadra solo tras cada cambio). Las tools remove_*, clear_diagram e import_diagram son destructivas.
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# ---------------------------------------------------------------------------
# Log
# ---------------------------------------------------------------------------
logging.level.app.arquidraw=INFO
